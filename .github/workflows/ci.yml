name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fpco/stack-build:lts-24.52
    env:
      STACK_ROOT: /tmp/.stack-root
      STACK_VERSION: "3.11.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Stack cache key
        id: stack_cache_key
        run: |
          stack_cache_hash=$(sha256sum stack.yaml stack.yaml.lock kip.cabal | sha256sum | cut -d ' ' -f 1)
          printf 'hash=%s\n' "$stack_cache_hash" >> "$GITHUB_OUTPUT"

      - name: Restore Stack artifacts
        id: stack_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/.stack-root
          key: ${{ runner.os }}-stack-${{ env.STACK_VERSION }}-ghc-9_14_1-${{ steps.stack_cache_key.outputs.hash }}
          restore-keys: |
            ${{ runner.os }}-stack-${{ env.STACK_VERSION }}-ghc-9_14_1-

      - name: Install Foma
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg foma libfoma-dev

      - name: Install Stack
        run: |
          curl -fsSLo /tmp/stack.tar.gz "https://github.com/commercialhaskell/stack/releases/download/v${STACK_VERSION}/stack-${STACK_VERSION}-linux-x86_64.tar.gz"
          echo "1fda71e657cd8d355625cc66b61b352699279dfee2664c014a392163bd19a952  /tmp/stack.tar.gz" | sha256sum --check -
          tar -xzf /tmp/stack.tar.gz -C /tmp
          install -m 0755 "/tmp/stack-${STACK_VERSION}-linux-x86_64/stack" /usr/local/bin/stack
          stack --version

      - name: Install Node.js 20
        run: |
          mkdir -p /etc/apt/keyrings
          curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
          echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
          apt-get update
          apt-get install -y --no-install-recommends nodejs
          node --version

      - name: Build Haskell dependencies
        run: stack --allow-different-user build --test --no-run-tests --only-dependencies

      - name: Setup HLint
        uses: haskell-actions/hlint-setup@v2

      - name: Run HLint
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["app","src","tests"]'
          fail-on: warning

      - name: Stack test
        run: stack --allow-different-user test

      - name: Save Stack artifacts
        if: ${{ steps.stack_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/.stack-root
          key: ${{ steps.stack_cache.outputs.cache-primary-key }}
