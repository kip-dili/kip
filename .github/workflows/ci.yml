name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup HLint
        uses: haskell-actions/hlint-setup@v2

      - name: Run HLint
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["app","src","tests"]'
          fail-on: warning

  test:
    runs-on: ubuntu-latest
    container:
      image: fpco/stack-build:lts-21.25
    env:
      STACK_ROOT: /tmp/.stack-root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Stack artifacts
        uses: actions/cache@v4
        with:
          path: |
            /tmp/.stack-root
          key: ${{ runner.os }}-stack-lts-21_25-${{ hashFiles('stack.yaml', 'stack.yaml.lock', '*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-lts-21_25-

      - name: Install Foma
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl gnupg foma libfoma-dev

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Stack test
        run: stack --allow-different-user test
